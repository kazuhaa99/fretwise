server {
    listen 80;

    # Default is 1MB, which rejects most real audio/video uploads with 413.
    # Raised to cover full songs and concert-length video files.
    client_max_body_size 500M;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxied to the backend container — same origin as the static assets, so
    # the browser never needs CORS for uploads, SSE progress, audio playback,
    # or the .gp5 download. Buffering is off because the progress stream is
    # SSE: nginx must forward each event as it arrives, not batch them.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
